name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ascii only (code, docs, config)
        run: |
          if grep -rnP '[^\x00-\x7F]' --exclude-dir=.git --exclude=LICENSE .; then
            echo "non-ASCII characters found"; exit 1
          fi
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build (linux amd64 + arm64)
        run: |
          go build -ldflags="-s -w" -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o /dev/null .
